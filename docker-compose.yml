services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    volumes:
      - commerce-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://commerce:commerce@db:5432/commerce
      DIRECT_URL: postgresql://commerce:commerce@db:5432/commerce
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  commerce-data:
